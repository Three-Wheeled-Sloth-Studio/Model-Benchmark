[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tws-model-benchmark"
version = "0.1.0"
description = "Local Ollama model qualification harness for structured product and job-search workloads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=6.0,<8",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
model-benchmark = "model_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_benchmark"]

[tool.hatch.build.targets.wheel.force-include]
"src/model_benchmark/data/baseline.json" = "model_benchmark/data/baseline.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
